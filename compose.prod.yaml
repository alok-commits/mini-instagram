# Example SINGLE-HOST TLS override; base compose keeps direct ports loopback-only.
# Requires certs, valid DNS and .env public HTTPS URLs. See docs/DEPLOYMENT.md.
services:
  keycloak:
    command: [start, --import-realm]
    environment:
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HOSTNAME_STRICT: 'true'
      KC_HTTP_ENABLED: 'true'
  api-gateway:
    environment:
      JWT_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/mini-instagram
      JWT_JWKS: http://keycloak:8080/realms/mini-instagram/protocol/openid-connect/certs
      REDIS_HOST: redis
      FRONTEND_ORIGIN: ${PUBLIC_WEB_ORIGIN}
      GATEWAY_TRUST_PROXY: 'true'
      OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      TRACE_SAMPLE_RATE: ${TRACE_SAMPLE_RATE:-0.1}
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
        VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}
    restart: unless-stopped
    networks: [edge]
    security_opt: [no-new-privileges:true]
  nginx:
    image: nginx:1.29.0-alpine
    restart: unless-stopped
    depends_on: [api-gateway, frontend, keycloak]
    networks: [edge]
    ports: ['80:80', '443:443']
    environment:
      PUBLIC_API_HOST: ${PUBLIC_API_HOST}
      PUBLIC_AUTH_HOST: ${PUBLIC_AUTH_HOST}
      PUBLIC_WEB_HOST: ${PUBLIC_WEB_HOST}
    volumes:
      - ./infrastructure/nginx/templates:/etc/nginx/templates:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    security_opt: [no-new-privileges:true]
