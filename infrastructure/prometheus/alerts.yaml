groups:
  - name: mini-instagram
    rules:
      - alert: ServiceUnavailable
        expr: up{job="mini-instagram"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} cannot be scraped"
      - alert: HighRequestErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])),1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx rate exceeds 5%"
