[SERVICE]
    Flush         2
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf

[INPUT]
    Name          tail
    Tag           instagram.java
    Path          /app/logs/*.json
    Parser        app_json
    Read_from_Head true
    DB            /fluent-bit/state/tail.db
    Mem_Buf_Limit 10MB
    Skip_Long_Lines On

[OUTPUT]
    Name          loki
    Match         instagram.*
    Host          loki
    Port          3100
    Labels        job=mini-instagram
    Line_Format   json
