spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: like-service
  security:
    oauth2:
      client:
        registration:
          like-service:
            provider: keycloak
            client-id: like-service
            client-secret: ${LIKE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URL:http://localhost:8180/realms/mini-instagram/protocol/openid-connect/token}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/like_db}
    username: ${DB_USER:like_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
security:
  issuer-uri: ${JWT_ISSUER:http://localhost:8180/realms/mini-instagram}
  jwk-set-uri: ${JWT_JWKS:http://localhost:8180/realms/mini-instagram/protocol/openid-connect/certs}
  audience: instagram-api
server:
  shutdown: graceful
  port: 8083
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
post-service:
  base-url: ${POST_SERVICE_URL:http://localhost:8082}
resilience4j:
  circuitbreaker:
    instances:
      postService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      postService:
        maxAttempts: 2
        waitDuration: 150ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
