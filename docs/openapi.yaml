openapi: 3.0.3
info:
  title: Mini Instagram Business API
  version: 1.0.0
  description: Ten public business API methods; OIDC auth and internal service lookups are separate.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Read current user profile
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [Users]
      summary: Update profile fields
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateProfile'}}}
      responses:
        '200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/posts:
    get:
      tags: [Posts]
      summary: List active posts
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Recent posts, content: {application/json: {schema: {$ref: '#/components/schemas/PostPage'}}}}
    post:
      tags: [Posts]
      summary: Create a post
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreatePost'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/posts/{postId}:
    parameters:
      - {$ref: '#/components/parameters/PostId'}
    get:
      tags: [Posts]
      summary: Get active post
      responses:
        '200': {description: Post details, content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Posts]
      summary: Edit own post
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePost'}}}
      responses:
        '200': {description: Updated post, content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}}
        '403': {description: Not post owner}
    delete:
      tags: [Posts]
      summary: Delete own post
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Soft-deleted}
        '403': {description: Not post owner}
  /api/v1/posts/{postId}/likes/me:
    parameters:
      - {$ref: '#/components/parameters/PostId'}
    put:
      tags: [Likes]
      summary: Idempotently like the active post
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Like recorded or already present}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Likes]
      summary: Idempotently remove own like
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Like removed or absent}
  /api/v1/posts/{postId}/likes/count:
    parameters:
      - {$ref: '#/components/parameters/PostId'}
    get:
      tags: [Likes]
      summary: Get like count for an active post
      responses:
        '200': {description: Like count, content: {application/json: {schema: {$ref: '#/components/schemas/LikeCount'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    PostId: {name: postId, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Unauthorized: {description: Missing, invalid, expired, wrong-issuer or wrong-audience JWT}
    NotFound: {description: Active post was not found}
  schemas:
    Profile:
      type: object
      properties:
        id: {type: string, format: uuid}
        keycloakUserId: {type: string}
        username: {type: string}
        displayName: {type: string}
        bio: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UpdateProfile:
      type: object
      properties:
        displayName: {type: string, minLength: 1, maxLength: 120}
        bio: {type: string, maxLength: 300}
    CreatePost:
      type: object
      required: [caption]
      properties:
        caption: {type: string, minLength: 1, maxLength: 2200}
        imageUrl: {type: string, pattern: '^https://.+'}
    UpdatePost:
      type: object
      properties:
        caption: {type: string, minLength: 1, maxLength: 2200}
        imageUrl: {type: string, pattern: '^https://.+'}
    Post:
      type: object
      properties:
        id: {type: string, format: uuid}
        authorId: {type: string}
        caption: {type: string}
        imageUrl: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64}
    PostPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Post'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer}
        totalPages: {type: integer}
    LikeCount:
      type: object
      properties:
        postId: {type: string, format: uuid}
        count: {type: integer, format: int64}
